name: Fetch AQI Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data collection script
        env:
          OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
        run: python fetch_data.py

      - name: Run feature engineering script
        run: python feature_engineering.py

      - name: Commit and push new data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add aqi_weather_data.csv aqi_weather_data_features.csv
          git diff --quiet --cached || git commit -m "Add hourly AQI data + updated features"
          git push