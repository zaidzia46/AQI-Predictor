name: Fetch AQI Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data collection script
        run: python src/fetch_data.py

      - name: Run feature engineering script
        run: python src/feature_engineering.py

      - name: Run data cleaning script
        run: python src/clean_data.py

      - name: Push features to Hopsworks
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python src/push_to_hopsworks.py

      - name: Commit and push new data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/aqi_weather_data.csv data/processed/aqi_weather_data_features.csv data/processed/aqi_weather_data_train.csv data/processed/latest_features.csv
          git diff --quiet --cached || git commit -m "Add hourly AQI data + updated features"
          git push